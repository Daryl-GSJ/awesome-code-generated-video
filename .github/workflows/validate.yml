name: Validate data and generated artifacts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Validate catalog data
        run: python scripts/validate_data.py

      - name: Regenerate charts and analysis
        run: python scripts/generate_charts.py

      - name: Verify generated artifacts are current
        run: git diff --exit-code -- analysis.md assets/
