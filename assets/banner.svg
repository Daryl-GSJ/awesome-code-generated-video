<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">Awesome Code-Generated Video</title>
  <desc id="d">A code editor on the left emits an executable animation program; a renderer on the right turns it into film frames in which a ball moves along a path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1E2D"/>
      <stop offset="0.55" stop-color="#123A55"/>
      <stop offset="1" stop-color="#0F5257"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7FCDBB"/>
      <stop offset="1" stop-color="#F0B429"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7FCDBB" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7FCDBB" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F0B429" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="screen"><rect x="890" y="92" width="300" height="168" rx="6"/></clipPath>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#grid)"/>

  <!-- Title -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="92" fill="#FFFFFF" font-size="46" font-weight="800" letter-spacing="-0.5">Awesome Code-Generated Video</text>
    <rect x="66" y="110" width="132" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="64" y="152" fill="#CFE3EA" font-size="20">Models write executable visual programs.</text>
    <text x="64" y="180" fill="#CFE3EA" font-size="20">Deterministic runtimes render them into video.</text>
    <g font-size="14" font-weight="600">
      <g transform="translate(64,214)">
        <rect width="78" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#7FCDBB" stroke-opacity="0.6"/>
        <text x="39" y="19" text-anchor="middle" fill="#B8E3D5">Manim</text>
      </g>
      <g transform="translate(152,214)">
        <rect width="88" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#7FCDBB" stroke-opacity="0.6"/>
        <text x="44" y="19" text-anchor="middle" fill="#B8E3D5">Blender</text>
      </g>
      <g transform="translate(250,214)">
        <rect width="104" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#7FCDBB" stroke-opacity="0.6"/>
        <text x="52" y="19" text-anchor="middle" fill="#B8E3D5">HTML / JS</text>
      </g>
      <g transform="translate(364,214)">
        <rect width="104" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#7FCDBB" stroke-opacity="0.6"/>
        <text x="52" y="19" text-anchor="middle" fill="#B8E3D5">SVG / Lottie</text>
      </g>
      <g transform="translate(64,250)">
        <rect width="94" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#F0B429" stroke-opacity="0.6"/>
        <text x="47" y="19" text-anchor="middle" fill="#F7D987">Remotion</text>
      </g>
      <g transform="translate(168,250)">
        <rect width="92" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#F0B429" stroke-opacity="0.6"/>
        <text x="46" y="19" text-anchor="middle" fill="#F7D987">Three.js</text>
      </g>
      <g transform="translate(270,250)">
        <rect width="198" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#F0B429" stroke-opacity="0.6"/>
        <text x="99" y="19" text-anchor="middle" fill="#F7D987">Simulation / Game engines</text>
      </g>
    </g>
    <text x="64" y="312" fill="#8FB3C2" font-size="13">research-first catalog · papers · benchmarks · runtimes · open problems</text>
  </g>

  <!-- Code editor -->
  <g transform="translate(560,78)">
    <rect width="270" height="196" rx="10" fill="#0A1622" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <rect width="270" height="26" rx="10" fill="#132636"/>
    <rect y="16" width="270" height="10" fill="#132636"/>
    <circle cx="16" cy="13" r="4.5" fill="#FF5F56"/>
    <circle cx="31" cy="13" r="4.5" fill="#FFBD2E"/>
    <circle cx="46" cy="13" r="4.5" fill="#27C93F"/>
    <text x="135" y="17" text-anchor="middle" fill="#7C93A3" font-family="Menlo, Consolas, monospace" font-size="11">scene.py</text>
    <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5">
      <text x="14" y="50"><tspan fill="#C792EA">class</tspan><tspan fill="#FFCB6B"> Orbit</tspan><tspan fill="#D6E4EE">(Scene):</tspan></text>
      <text x="14" y="72"><tspan fill="#C792EA">  def</tspan><tspan fill="#82AAFF"> construct</tspan><tspan fill="#D6E4EE">(self):</tspan></text>
      <text x="14" y="94"><tspan fill="#D6E4EE">    dot = </tspan><tspan fill="#FFCB6B">Dot</tspan><tspan fill="#D6E4EE">(color=</tspan><tspan fill="#C3E88D">TEAL</tspan><tspan fill="#D6E4EE">)</tspan></text>
      <text x="14" y="116"><tspan fill="#D6E4EE">    path = </tspan><tspan fill="#FFCB6B">Arc</tspan><tspan fill="#D6E4EE">(angle=</tspan><tspan fill="#F78C6C">PI</tspan><tspan fill="#D6E4EE">)</tspan></text>
      <text x="14" y="138"><tspan fill="#D6E4EE">    self.</tspan><tspan fill="#82AAFF">play</tspan><tspan fill="#D6E4EE">(</tspan><tspan fill="#FFCB6B">MoveAlong</tspan><tspan fill="#D6E4EE">(</tspan></text>
      <text x="14" y="160"><tspan fill="#D6E4EE">      dot, path), run_time=</tspan><tspan fill="#F78C6C">2</tspan><tspan fill="#D6E4EE">)</tspan></text>
      <rect x="14" y="170" width="8" height="15" fill="#7FCDBB">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Render beam -->
  <g>
    <rect x="836" y="172" width="48" height="4" rx="2" fill="url(#beam)">
      <animate attributeName="x" values="832;846;832" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <path d="M866 164 L880 174 L866 184" fill="none" stroke="#F0B429" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="858" y="152" text-anchor="middle" fill="#8FB3C2" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600">render</text>
  </g>

  <!-- Film strip -->
  <g>
    <rect x="874" y="70" width="332" height="212" rx="12" fill="#06111A" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <g fill="#1E3446">
      <rect x="890" y="76" width="14" height="9" rx="2"/><rect x="926" y="76" width="14" height="9" rx="2"/>
      <rect x="962" y="76" width="14" height="9" rx="2"/><rect x="998" y="76" width="14" height="9" rx="2"/>
      <rect x="1034" y="76" width="14" height="9" rx="2"/><rect x="1070" y="76" width="14" height="9" rx="2"/>
      <rect x="1106" y="76" width="14" height="9" rx="2"/><rect x="1142" y="76" width="14" height="9" rx="2"/>
      <rect x="1178" y="76" width="14" height="9" rx="2"/>
      <rect x="890" y="267" width="14" height="9" rx="2"/><rect x="926" y="267" width="14" height="9" rx="2"/>
      <rect x="962" y="267" width="14" height="9" rx="2"/><rect x="998" y="267" width="14" height="9" rx="2"/>
      <rect x="1034" y="267" width="14" height="9" rx="2"/><rect x="1070" y="267" width="14" height="9" rx="2"/>
      <rect x="1106" y="267" width="14" height="9" rx="2"/><rect x="1142" y="267" width="14" height="9" rx="2"/>
      <rect x="1178" y="267" width="14" height="9" rx="2"/>
    </g>
    <rect x="890" y="92" width="300" height="168" rx="6" fill="#0E2232"/>
    <g clip-path="url(#screen)">
      <path d="M940 230 A100 100 0 0 1 1140 230" fill="none" stroke="#7FCDBB" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 6"/>
      <line x1="900" y1="230" x2="1180" y2="230" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <circle r="11" fill="#F0B429">
        <animateMotion dur="2.4s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" path="M940 230 A100 100 0 0 1 1140 230"/>
      </circle>
      <circle r="18" fill="#F0B429" fill-opacity="0.18">
        <animateMotion dur="2.4s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" path="M940 230 A100 100 0 0 1 1140 230"/>
      </circle>
    </g>
    <g font-family="Menlo, Consolas, monospace" font-size="10.5" fill="#7C93A3">
      <text x="898" y="108">00:00:01:12</text>
      <text x="1182" y="108" text-anchor="end">1080p · 30 fps</text>
    </g>
    <rect x="898" y="248" width="284" height="3" rx="1.5" fill="#1E3446"/>
    <rect x="898" y="248" width="0" height="3" rx="1.5" fill="url(#accent)">
      <animate attributeName="width" values="0;284" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
